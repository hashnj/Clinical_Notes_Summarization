[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-note-summarization"
version = "0.1.0"
description = "Research prototype for evidence-grounded clinical note summarization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clinical_note_summarization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
