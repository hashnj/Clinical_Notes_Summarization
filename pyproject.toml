[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-note-summarization"
version = "0.1.0"
description = "Research prototype for OCR-assisted medical report summarization with evidence verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
app = [
	"numpy>=1.26,<3",
	"Pillow>=10,<13",
	"rapidocr>=3.10,<4",
	"streamlit>=1.43,<2",
	"onnxruntime>=1.20,<2",
]
models = [
	"torch>=2.2,<3",
	"transformers>=4.45,<5",
	"sentencepiece>=0.2,<1",
	"huggingface-hub>=0.25,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clinical_note_summarization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
